<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>46th Adult Harvest | Photo Watermark</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#173a2b;background:#f3f7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:24px}header{text-align:center;background:linear-gradient(130deg,#064b2d,#0b7040);color:white;padding:34px 18px;border-radius:20px}header img{width:min(250px,75%)}h1{margin:10px 0 5px;font-size:clamp(24px,4vw,36px)}.panel{background:white;padding:24px;margin-top:20px;border-radius:18px;box-shadow:0 6px 25px #14382212}.drop{display:block;border:2px dashed #77a38b;border-radius:14px;padding:28px;text-align:center;cursor:pointer;background:#f9fcf9}.drop input{display:none}.controls{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:20px 0}.controls label{flex:1;min-width:190px}input[type=range]{width:100%;accent-color:#12683c}.preview{background:#e8ede9;border-radius:12px;min-height:180px;display:grid;place-items:center;overflow:hidden}.preview canvas{max-width:100%;max-height:65vh;object-fit:contain}button{border:0;border-radius:12px;background:#08643a;color:white;font-size:16px;font-weight:700;padding:14px 20px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px}.muted{color:#597063;font-size:14px}footer{text-align:center;padding:24px;color:#5c7465}</style></head><body><main class="wrap"><header><img src="watermark.png" alt="46th Adult Harvest emblem"><h1>Harvest Photo Watermark</h1><p>Upload • Add watermark • Download in original resolution</p></header><section class="panel"><label class="drop" id="drop"><strong>Tap to select a photograph</strong><p class="muted">Or drag and drop a JPG, PNG or WebP image here</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><div class="controls"><label>Watermark width: <output id="sizeValue">24%</output><input id="size" type="range" min="10" max="40" value="24"></label><label>Edge margin: <output id="marginValue">2%</output><input id="margin" type="range" min="0" max="8" value="2"></label></div><div class="preview"><canvas id="canvas" aria-label="Image preview"></canvas><span id="empty" class="muted">Your photo preview will appear here.</span></div><div class="actions"><button id="download" disabled>Download full-resolution PNG</button><span class="muted" id="status">Your photograph is processed only in your browser.</span></div></section><footer>46th Adult Harvest • Harvest of Multiple Blessings</footer></main><script>
const file=document.querySelector('#file'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),size=document.querySelector('#size'),margin=document.querySelector('#margin'),download=document.querySelector('#download'),status=document.querySelector('#status'),empty=document.querySelector('#empty');let photo=null,filename='harvest-photo',objectURL=null;const logo=new Image();logo.src='watermark.png';logo.onload=render;logo.onerror=()=>status.textContent='Watermark asset could not be loaded.';
function render(){if(!photo||!logo.complete||!logo.naturalWidth)return;canvas.width=photo.naturalWidth;canvas.height=photo.naturalHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(photo,0,0);const w=Math.min(canvas.width*Number(size.value)/100,canvas.width*.9),h=w*logo.naturalHeight/logo.naturalWidth,pad=Math.min(canvas.width,canvas.height)*Number(margin.value)/100;const scale=Math.min(1,(canvas.height-2*pad)/h);ctx.drawImage(logo,canvas.width-w*scale-pad,canvas.height-h*scale-pad,w*scale,h*scale);document.querySelector('#sizeValue').textContent=size.value+'%';document.querySelector('#marginValue').textContent=margin.value+'%';empty.hidden=true;download.disabled=false;status.textContent=`${canvas.width} × ${canvas.height} pixels • Original dimensions preserved`}
function load(f){if(!f||!['image/jpeg','image/png','image/webp'].includes(f.type)){status.textContent='Please select a JPG, PNG or WebP image.';return}download.disabled=true;status.textContent='Loading image…';if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);const img=new Image();img.onload=()=>{photo=img;filename=f.name.replace(/\.[^.]+$/,'');render()};img.onerror=()=>status.textContent='Unable to read this image.';img.src=objectURL}
file.onchange=()=>load(file.files[0]);[size,margin].forEach(el=>el.oninput=render);const drop=document.querySelector('#drop');drop.ondragover=e=>{e.preventDefault()};drop.ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};download.onclick=()=>canvas.toBlob(blob=>{if(!blob){status.textContent='Could not export image.';return}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename+'-harvest-watermarked.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),15000)},'image/png');
</script></body></html>
